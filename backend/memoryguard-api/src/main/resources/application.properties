quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# Kafka
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

mp.messaging.incoming.memory-events.connector=smallrye-kafka
mp.messaging.incoming.memory-events.topic=memory-events
mp.messaging.incoming.memory-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.memory-events.auto.offset.reset=earliest

# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:admin}
quarkus.datasource.password=${DB_PASSWORD:admin123}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:appdb}

# Para fase inicial de desenvolvimento
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true